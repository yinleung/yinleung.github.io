<style>

    --bg: #faf7f1; --card-bg: #fff;
    --gap: 4mm; --pad: 11mm;

  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-family: 'Nunito', sans-serif; color: var(--text); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  #root { width: 100%; height: 100%; display: grid; grid-template-rows: auto 1fr; }
  @media screen { html { background:#bbb; overflow:hidden; width:100vw; height:100vh; } body { position:absolute; box-shadow:0 4px 30px rgba(0,0,0,.3); border-radius:4px; } }
  @media print { html { background:none; } body { position:static; transform:none!important; box-shadow:none; border-radius:0; } .toolbar,.divider,.swap-handle,.drop-zone{display:none!important;} }

  .header .authors sup { font-size:calc(7pt * var(--font-scale)); color:#e3b277; }

  .qr .ql { font-size:calc(9.5pt * var(--font-scale)); color:#e3b277; font-weight:800; margin-top:2mm; line-height:1.1; }
  /* institutional logos — colorful, each on its own white tile (like the QR codes) */
  .logo-panel { display:flex; flex-direction:column; align-items:center; gap:5mm; }
  .logo-row { display:flex; flex-direction:row; align-items:center; justify-content:center; gap:8mm; }
  .logo-panel img { height:18mm; box-sizing:border-box; width:auto; object-fit:contain; display:block; background:#fff; padding:2mm 2.6mm; border-radius:2mm; box-shadow:0 1px 3px rgba(0,0,0,.2); }

  /* === POSTER COLUMNS === */
  .poster { display:flex; gap:var(--gap); padding:var(--gap) var(--pad) calc(var(--gap) + 2mm); min-height:0; flex:1; overflow:hidden; }
  /* Spacing between cards is applied as card margin (not flex gap) so it is identical on screen and in print — the edit-mode dividers/drop-zones are extra flex children that would otherwise multiply the gap on screen only. */
  .col { display:flex; flex-direction:column; gap:0; min-height:0; overflow:hidden; }
  .col > .card { margin-bottom: var(--gap); }

  /* === CARD === */
  .card { background:var(--card-bg); border-radius:3mm; padding:3.5mm 4.5mm 4mm; box-shadow:0 1px 4px rgba(20,40,70,.08); border-top:3px solid var(--blue); display:flex; flex-direction:column; overflow:hidden; min-height:0; flex:0 0 auto; position:relative; transition: outline .15s; }
  .card.grow { flex:1 1 0; }
  .card.orange { border-top-color:var(--orange); }
  .card.teal   { border-top-color:var(--teal); }
  .card.purple { border-top-color:var(--purple); }
  .card.red    { border-top-color:var(--red); }

  .card h2 { font-family:'Newsreader', Georgia, serif; font-size:calc(14pt * var(--font-scale)); font-weight:700; letter-spacing:-.2px; margin-bottom:2mm; flex-shrink:0; color:var(--blue); display:flex; align-items:baseline; gap:2mm; }

  .card.orange h2{color:var(--orange);} .card.orange h2 .num{background:var(--orange);}
  .card.teal h2{color:var(--teal);} .card.teal h2 .num{background:var(--teal);}
  .card.purple h2{color:var(--purple);} .card.purple h2 .num{background:var(--purple);}
  .card.red h2{color:var(--red);} .card.red h2 .num{background:var(--red);}
  .card p,.card li { font-size:calc(10pt * var(--font-scale)); line-height:1.32; }
  .card ul,.card ol { padding-left:5mm; flex-shrink:0; }
  .card li { margin-bottom:1mm; }
  .card li::marker { font-weight:800; color:var(--blue); }
  .card.orange li::marker{color:var(--orange);} .card.teal li::marker{color:var(--teal);} .card.purple li::marker{color:var(--purple);} .card.red li::marker{color:var(--red);}
  .card b.k { color:var(--blue); } .card.teal b.k{color:var(--teal);} .card.purple b.k{color:var(--purple);} .card.red b.k{color:var(--red);} .card.orange b.k{color:var(--orange);}

  /* Highlight box */
  .hl { background:var(--blue-light); border-left:3px solid var(--blue); padding:3mm 4mm; border-radius:0 2mm 2mm 0; margin-bottom:2.5mm; flex-shrink:0; }

  .card[data-id="tldr"] .hl p { font-size:calc(9pt * var(--font-scale)); line-height:1.3; }
  .card[data-id="tldr"] li { font-size:calc(9.5pt * var(--font-scale)); }
  .card.teal .hl{background:var(--teal-light);border-left-color:var(--teal);}

  /* Definition rows */
  .defs { display:flex; flex-direction:column; gap:1.4mm; margin:.5mm 0 2mm; flex-shrink:0; }

  .def b { color:var(--teal); }

  /* Figure */
  .fig { flex:1; display:flex; flex-direction:column; min-height:0; margin:1.5mm 0 0; }
  .figrow { flex:1; display:flex; gap:3mm; min-height:0; }
  .figrow .fig { margin:0; }
  .fig-wrap { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; overflow:hidden; }
  .fig-wrap img { width:100%; height:100%; object-fit:contain; border-radius:1.5mm; display:block; }
  .fig .cap { font-size:calc(8pt * var(--font-scale)); color:var(--text-light); margin-top:1.2mm; line-height:1.22; flex-shrink:0; }
  .fig .cap b { color:var(--text); }

  /* Math */
  .katex { font-size:calc(10.5pt * var(--font-scale))!important; }
  .eq { background:#f5f2ea; border:1px solid #e7e0d3; border-left:3px solid var(--blue); border-radius:1.5mm; padding:2.5mm 3mm; margin:1.5mm 0; text-align:center; flex-shrink:0; }
  .eq.orange { border-left-color:var(--orange); background:var(--orange-light); border-color:var(--orange); }
  .eq.purple { border-left-color:var(--purple); }
  .eq.red { border-left-color:var(--red); }
  .eq.teal { border-left-color:var(--teal); }
  .eq.fit .katex { font-size:calc(9.5pt * var(--font-scale))!important; }
  .eqlbl { font-size:calc(7.5pt * var(--font-scale)); font-weight:800; color:var(--text-light); letter-spacing:.2px; margin-bottom:1mm; }

  /* Links */
  .links { display:flex; align-items:center; gap:4mm; background:var(--blue-light); padding:3mm 4mm; border-radius:2mm; margin-top:2mm; flex-shrink:0; }
  .links .ll { font-size:calc(9.5pt * var(--font-scale)); line-height:1.5; }
  .links .ll b { color:var(--blue); }

  /* === TOOLBAR === */
  .toolbar { position:fixed; top:8px; right:8px; z-index:1000; display:flex; gap:6px; align-items:center; }
  .toolbar button { font-family:'Nunito'; font-size:11px; font-weight:700; padding:5px 12px; border-radius:6px; border:none; cursor:pointer; background:#eee; color:#555; }
  .toolbar button:hover { background:#ddd; }

  /* Swap handles */
  .card .swap-handle { position:absolute; top:1.5mm; right:1.5mm; width:8mm; height:8mm; background:var(--blue); color:#fff; border-radius:1.5mm; font-size:9pt; text-align:center; line-height:8mm; cursor:pointer; z-index:10; user-select:none; opacity:.35; transition: opacity .15s, background .15s, transform .15s; }
  .card .swap-handle:hover { opacity:.85; transform:scale(1.15); }
  .card.swap-selected { outline:3px solid var(--orange); outline-offset:-1px; }
  .card.swap-selected .swap-handle { background:var(--orange); opacity:1; transform:scale(1.2); }

  /* Dividers */
  .divider { position:relative; z-index:50; flex-shrink:0; }
  .divider::after { content:''; position:absolute; background:rgba(45,127,193,.12); border-radius:1.5mm; transition:background .15s; }
  .divider:hover::after, .divider.active::after { background:rgba(45,127,193,.5); }
  .col-resize { width:6mm; cursor:col-resize; margin:0 -3mm; }
  .col-resize::after { top:0; bottom:0; left:1.5mm; width:3mm; }
  .row-resize { height:6mm; cursor:row-resize; margin:-3mm 0; }
  .row-resize::after { left:0; right:0; top:1.5mm; height:3mm; }

  /* Drop zones */
  .drop-zone { height:0; position:relative; z-index:60; transition: height .15s; }
  .drop-zone.visible { height:5mm; }
  .drop-zone-inner { position:absolute; left:2mm; right:2mm; top:0; bottom:0; border-radius:1.5mm; background:rgba(226,137,47,.15); border:2px dashed var(--orange); transition: background .15s; cursor:pointer; }
  .drop-zone-inner:hover { background:rgba(226,137,47,.35); }
</style>
</head>

<script type="text/babel" data-presets="react">
/* @jsxRuntime classic */
const { useState, useRef, useEffect, useCallback } = React;
const MM = 3.7795275591;
const POSTER_W_MM = 594;
const POSTER_H_MM = 841;

const CARD_REGISTRY = {
  /* ---------------------------------------------------------------- */
  tldr: {
    title: 'TL;DR', num: null, color: null, grow: false,
    body: (
      <>
        <div className="hl"><p>Muon shows strong empirical performance in LLM training, but the theoretical role of momentum remains unclear. We show that momentum in Muon acts as a <b className="k">spectral filter</b>: under a <b className="k">signal-plus-perturbation</b> gradient model, it suppresses perturbations while preserving the dominant gradient signal, <b className="k">enlarging the spectral gap</b> between them and stabilizing the singular subspaces passed to Muon's orthogonalization step. Applying momentum <b className="k">before</b> orthogonalization achieves provably stronger signal alignment than reversing the order or removing momentum — hence the rule: <b className="k">denoise first, then orthogonalize</b>.</p></div>
        <ul>
          <li><b className="k">Spectral gap</b> grows with the momentum window size <span>{'$T=\\tfrac{1}{1-\\beta}$'}</span>; the top-<span>{'$r$'}</span> subspace error decays as <span>{'$O(T^{-1/4})$'}</span>.</li>
          <li><b className="k">Validated</b> on synthetic, CIFAR-10, and NanoGPT probe experiments.</li>
        </ul>
      </>
    ),
  },
  /* ---------------------------------------------------------------- */
  question: {
    title: 'The question Muon raises', num: '1', color: 'orange', grow: false,
    body: (
      <>
        <p>Muon and Orthogonal-SGDM use the <b>same two operations</b> — momentum and orthogonalization — in <b>opposite order</b>. Empirically Muon wins, yet prior theory says nothing about why. Three pipelines for the update <span>{'$\\Delta W_t$'}</span>:</p>
        <div className="pipes">
          <div className="pipe win">
            <span className="pname">Pre-polar <span style={{fontWeight:800}}>(Muon)</span></span>
            <span className="peq">{'$\\Delta W_t \\propto \\mathcal{O}(M_t)$'}</span>
            <span className="ptag">average → orthogonalize ✓</span>
          </div>
          <div className="pipe">
            <span className="pname">Post-polar <span style={{fontWeight:800}}>(Orth-SGDM)</span></span>
            <span className="peq">{'$\\widetilde M_t=\\beta\\widetilde M_{t-1}+(1-\\beta)\\mathcal{O}(G_t)$'}</span>
            <span className="ptag">orthogonalize → average</span>
          </div>
          <div className="pipe">
            <span className="pname">Polar-only</span>
            <span className="peq">{'$\\Delta W_t \\propto \\mathcal{O}(G_t)$'}</span>
            <span className="ptag">no momentum</span>
          </div>
        </div>
        <div className="figrow">
          <div className="fig"><div className="fig-wrap"><img src="e2e_nanogpt.png" alt="NanoGPT end-to-end loss" /></div><div className="cap"><b>NanoGPT.</b> Pre-polar wins.</div></div>
          <div className="fig"><div className="fig-wrap"><img src="e2e_llama.png" alt="LLaMA 350M end-to-end loss" /></div><div className="cap"><b>LLaMA 350M.</b> Same trend.</div></div>
        </div>
        <div className="qbox"><p>What role does momentum play on the gradient stream, and why does placing it <b>before</b> orthogonalization matter inside Muon?</p></div>
      </>
    ),
  },
  /* ---------------------------------------------------------------- */
  prelim: {
    title: 'Setup: signal-plus-perturbation gradient model', num: '2', color: 'teal', grow: false,
    body: (
      <>
        <div className="defs">
          <div className="def"><b>Momentum buffer.</b> <span>{'$M_t=\\beta M_{t-1}+(1-\\beta)G_t$'}</span>, effective window <span>{'$T=\\tfrac{1}{1-\\beta}$'}</span>.</div>
          <div className="def"><b>Polar factor.</b> <span>{'$\\mathcal{O}(X)=UV^{\\top}$'}</span> from the thin SVD <span>{'$X=U\\Sigma V^{\\top}$'}</span> — keeps directions, sets all singular values to 1.</div>
        </div>
        <div className="eq teal">
          <div className="eqlbl">Structured gradient (Assumption 1)</div>
          {'$G_t = G_t^{\\mathrm{sig}} + \\Xi_t,\\qquad G_t^{\\mathrm{sig}}=\\textstyle\\sum_{k=1}^{r}\\lambda_k(t)\\,u_k v_k^{\\top}$'}
        </div>
        <ul>
          <li><b className="k">Coherent signal</b> — directions <span>{'$\\{u_k v_k^{\\top}\\}$'}</span> are time-invariant.</li>
          <li><b className="k">BVMZOS perturbation</b> — <span>{'$\\mathbb{E}[\\Xi_t]=0$'}</span>, <span>{'$\\mathbb{E}\\|\\Xi_t\\|_F^2\\le\\eta$'}</span>, uncorrelated across <span>{'$t$'}</span> (covers heavy-tailed, time-dependent noise).</li>
          <li><b className="k">Signal persistence</b> — filtered coordinate <span>{'$|\\bar\\lambda_k(t)|\\ge c_{\\mathrm{sig}}\\lambda_k$'}</span> stays away from zero.</li>
        </ul>
      </>
    ),
  },
  /* ---------------------------------------------------------------- */
  gap: {
    title: 'Momentum opens a spectral gap', num: '3', color: null, grow: true,
    body: (
      <>
        <div className="eq">
          <div className="eqlbl">Theorem 1 · w.p. ≥ 1−(2T−1)<sup>−1/2</sup></div>
          {'$\\underbrace{\\sigma_k(M_t)\\ge c_{\\mathrm{sig}}\\lambda_k-\\tfrac{\\sqrt{\\eta}}{(2T-1)^{1/4}}}_{\\text{head }k\\le r:\\ \\text{signal kept}} \\;\\;,\\;\\; \\underbrace{\\sigma_{r+1}(M_t)\\le \\tfrac{\\sqrt{\\eta}}{(2T-1)^{1/4}}}_{\\text{tail: noise} \\to 0}$'}
        </div>
        <p>The gap <b className="k">widens with the window</b> <span>{'$T$'}</span> (heavier <span>{'$\\beta$'}</span>); the tail noise floor decays as <span>{'$T^{-1/4}$'}</span> — the <i>opposite</i> of classical analyses that degrade at large <span>{'$\\beta$'}</span>.</p>
        <div className="figrow">
          <div className="fig"><div className="fig-wrap"><img src="filt_spectrum.png" alt="Filtered singular value spectra" /></div><div className="cap"><b>Filtered spectra.</b> As <span>{'$\\beta\\!\\uparrow$'}</span>, the momentum spectrum moves toward the mean-gradient spectrum <span>{'$\\bar G$'}</span> — head first, tail later.</div></div>
          <div className="fig"><div className="fig-wrap"><img src="filt_ratio.png" alt="Per-step filtering ratio" /></div><div className="cap"><b>Per-step filtering ratio</b> <span>{'$\\sigma_k(M)/\\sigma_k(G)$'}</span>. The head-vs-tail gap is exactly the spectral gap of Theorem 1: head preserved, tail suppressed.</div></div>
        </div>
      </>
    ),
  },
  /* ---------------------------------------------------------------- */
  subspace: {
    title: 'Singular-subspace reliability', num: '4', color: 'purple', grow: false,
    body: (
      <>
        <div className="eq purple">
          <div className="eqlbl">Corollary 1 (via Wedin sinΘ)</div>
          {'$\\|\\sin\\Theta(\\hat U_t,U)\\|_2,\\;\\|\\sin\\Theta(\\hat V_t,V)\\|_2 \\;\\le\\; \\frac{\\sqrt{\\eta}/(2T-1)^{1/4}}{c_{\\mathrm{sig}}\\lambda_r-\\sqrt{\\eta}/(2T-1)^{1/4}} = O(T^{-1/4})$'}
        </div>
        <p>The larger the gap, the closer <span>{'$M_t$'}</span>'s leading subspaces are to the signal's — so the polar factor acts on a <b className="k">reliable</b> matrix.</p>
        <div className="fig"><div className="fig-wrap"><img src="direction_frozen.png" alt="Stationary subspace alignment error" /></div><div className="cap"><b>Stationary NanoGPT probe.</b> Subspace errors <span>{'$\\sin\\Theta_U,\\sin\\Theta_V$'}</span> at ranks <span>{'$r\\in\\{1,5,10\\}$'}</span> fall with <span>{'$T$'}</span>.</div></div>
        <div className="fig"><div className="fig-wrap"><img src="online_direction.png" alt="Trajectory subspace alignment error" /></div><div className="cap"><b>Trajectory probe (live training).</b> Subspace alignment error decays in <span>{'$T$'}</span> at every rank, even as the model trains. Corollary 1's prediction survives the time-varying signal of live training.</div></div>
      </>
    ),
  },
  /* ---------------------------------------------------------------- */
  dominate: {
    title: 'Pre-polar dominates Post-polar and Polar-only', num: '5', color: 'red', grow: true,
    body: (
      <>
        <div className="eq red fit">
          <div className="eqlbl">Theorem 2 · Pre-polar dominates (signal alignment, large T)</div>
          {'$\\underbrace{\\mathbb{E}\\!\\left[\\tfrac{\\langle\\mathcal{O}(M_t),\\,G^{\\mathrm{sig}}\\rangle_F}{\\langle\\mathcal{O}(G^{\\mathrm{sig}}),\\,G^{\\mathrm{sig}}\\rangle_F}\\right]}_{\\text{Pre-polar (Muon)}}\\;\\ge\\;\\max\\!\\left\\{\\underbrace{\\mathbb{E}\\!\\left[\\tfrac{\\langle\\mathcal{O}(G_t),\\,G^{\\mathrm{sig}}\\rangle_F}{\\langle\\mathcal{O}(G^{\\mathrm{sig}}),\\,G^{\\mathrm{sig}}\\rangle_F}\\right]}_{\\text{Polar-only}},\\;\\underbrace{\\mathbb{E}\\!\\left[\\tfrac{\\langle\\widetilde M_t,\\,G^{\\mathrm{sig}}\\rangle_F}{\\langle\\mathcal{O}(G^{\\mathrm{sig}}),\\,G^{\\mathrm{sig}}\\rangle_F}\\right]}_{\\text{Post-polar}}\\right\\}+\\tfrac{C}{2}$'}
        </div>
        <p>The polar factor replaces every singular value with <b>1</b>, so acting directly on a noisy gradient <b className="k">erases the amplitude gap</b> between signal and noise directions — and subsequent averaging cannot recover what was already destroyed.</p>
        <div className="figrow">
          <div className="fig"><div className="fig-wrap"><img src="order_online_beta.png" alt="Alignment vs beta" /></div><div className="cap"><b>Live NanoGPT, vs <span>{'$\\beta$'}</span>.</b> Pre-polar climbs; others nearly flat.</div></div>
          <div className="fig"><div className="fig-wrap"><img src="order_online_history.png" alt="Alignment across training" /></div><div className="cap"><b>Across training</b> (<span>{'$\\beta=0.95$'}</span>). Pre-polar leads throughout.</div></div>
        </div>
      </>
    ),
  },
  /* ---------------------------------------------------------------- */
  lowsnr: {
    title: 'Quantitative low-SNR signal-recovery separation', num: '6', color: 'teal', grow: false,
    body: (
      <>
        <div className="eq teal fit">
          <div className="eqlbl">Theorem 3 · rank-1 spiked Gaussian, low SNR <span>{'$\\lambda<0.25\\,\\sigma_\\Xi(\\sqrt m-\\sqrt n)$'}</span></div>
          {'$\\underbrace{\\mathbb{E}\\!\\left[\\tfrac{\\langle\\mathcal{O}(G_t),\\,G^{\\mathrm{sig}}\\rangle_F}{\\langle\\mathcal{O}(G^{\\mathrm{sig}}),\\,G^{\\mathrm{sig}}\\rangle_F}\\right]}_{\\text{Polar-only alignment}}\\;\\le\\;\\underbrace{\\tfrac{1}{\\sqrt m}+\\tfrac{4\\lambda}{\\sigma_\\Xi(\\sqrt m-\\sqrt n)}+4\\sqrt n\\,e^{-c(\\sqrt m-\\sqrt n)^2/4}}_{\\xrightarrow{\\,m\\to\\infty\\,}\\,0}$'}
        </div>
        <p><b className="k">Polar-only alignment vanishes</b> as <span>{'$m\\to\\infty$'}</span> — the rank-1 signal is buried in the noise bulk. <b className="k">Pre-polar still recovers it</b> for a large enough window <span>{'$T$'}</span> (Thm 2).</p>
      </>
    ),
  },
  /* ---------------------------------------------------------------- */
  takeaways: {
    title: 'Takeaways', num: null, color: null, grow: false,
    body: (
      <>
        <ul>
          <li><b className="k">Momentum is a spectral filter on the gradient stream.</b></li>
          <li><b className="k">Denoise first, then orthogonalize.</b> The polar factor benefits from operating on a buffer whose spectrum has already been denoised.</li> 
          <li><b className="k">The mechanism extends to any matrix-based optimizer beyond Muon.</b> Spectral filtering is a property of momentum acting on any noisy matrix gradient stream.</li>
        </ul>
      </>
    ),
  },
};

const DEFAULT_LAYOUT = {
  columns: [
    { id: 'col1', widthMm: 286, cards: ['tldr', 'question', 'prelim', 'gap'] },
    { id: 'col2', widthMm: null, cards: ['subspace', 'dominate', 'lowsnr', 'takeaways'] },
  ],
};
const DEFAULT_CARD_HEIGHTS = { tldr: 145.7, question: 226.0, prelim: 138.0, lowsnr: 96.0, dominate: 242.0, subspace: 307.5 };
const DEFAULT_FONT_SCALE = 2.3;

const DEFAULT_LOGOS = [
  { src: 'logos/ism_logo_en.png', alt: 'The Institute of Statistical Mathematics', heightMm: 11 },
];

/* ================================================================
   FRAMEWORK CODE — generally don't need to modify below this line
   ================================================================ */

function cloneLayout(layout) {
  return { columns: layout.columns.map(c => ({ id: c.id, widthMm: c.widthMm, cards: [...c.cards] })) };
}

const LS_KEY = 'posterConfig';
function getFullConfig(layout, cardHeights, fontScale, logos) {
  return { columns: layout.columns, cardHeights, fontScale, logos };
}
function loadInitialConfig() {
  try { const s = localStorage.getItem(LS_KEY); if (s) return JSON.parse(s); } catch(e) {}
  return null;
}
const INIT_CONFIG = loadInitialConfig();

function PosterApp() {
  const [layout, setLayout] = useState(INIT_CONFIG ? cloneLayout({columns: INIT_CONFIG.columns}) : cloneLayout(DEFAULT_LAYOUT));
  const [selectedCard, setSelectedCard] = useState(null);
  const [cardHeights, setCardHeights] = useState(INIT_CONFIG?.cardHeights || {...DEFAULT_CARD_HEIGHTS});
  const [preview, setPreview] = useState(false);
  const [logos, setLogos] = useState(INIT_CONFIG?.logos || DEFAULT_LOGOS);
  const [fontScale, setFontScaleState] = useState(INIT_CONFIG?.fontScale || DEFAULT_FONT_SCALE);
  const currentScaleRef = useRef(1);
  const posterRef = useRef(null);

  useEffect(() => { const cfg = getFullConfig(layout, cardHeights, fontScale, logos); localStorage.setItem(LS_KEY, JSON.stringify(cfg)); }, [layout, cardHeights, fontScale, logos]);
  useEffect(() => { document.documentElement.style.setProperty('--font-scale', fontScale); }, [fontScale]);
  useEffect(() => { document.body.classList.toggle('preview', preview); }, [preview]);

  const fit = useCallback(() => {
    if (window.matchMedia('print').matches) return;
    const pW = POSTER_W_MM * MM, pH = POSTER_H_MM * MM;
    const scale = Math.min(window.innerWidth / pW, window.innerHeight / pH);
    currentScaleRef.current = scale;
    const left = (window.innerWidth - pW * scale) / 2;
    const top = (window.innerHeight - pH * scale) / 2;
    document.body.style.transform = 'translate(' + left + 'px,' + top + 'px) scale(' + scale + ')';
  }, []);
  useEffect(() => { fit(); window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit); }, [fit]);

  useEffect(() => { if (typeof renderMathInElement === 'function') renderMathInElement(document.body, {delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]}); });

  useEffect(() => {
    function handler(e) { if (selectedCard && !e.target.closest('.swap-handle') && !e.target.closest('.drop-zone')) setSelectedCard(null); }
    document.addEventListener('click', handler); return () => document.removeEventListener('click', handler);
  }, [selectedCard]);

  function swapCards(id1, id2) {
    if (id1 === id2) return false;
    setLayout(prev => { const next = cloneLayout(prev); let l1, l2; for (const c of next.columns) { const i1 = c.cards.indexOf(id1); if (i1!==-1) l1={col:c,idx:i1}; const i2 = c.cards.indexOf(id2); if (i2!==-1) l2={col:c,idx:i2}; } if (!l1||!l2) return prev; l1.col.cards[l1.idx]=id2; l2.col.cards[l2.idx]=id1; return next; });
    setCardHeights(prev => { const n={...prev}; delete n[id1]; delete n[id2]; return n; });
    return true;
  }
  function moveCard(cardId, targetColId, position) {
    setLayout(prev => { const next = cloneLayout(prev); for (const c of next.columns) { const i = c.cards.indexOf(cardId); if (i!==-1) { c.cards.splice(i,1); break; } } const tc = next.columns.find(c=>c.id===targetColId); if (!tc) return prev; tc.cards.splice(Math.max(0,Math.min(position,tc.cards.length)),0,cardId); return next; });
    setCardHeights(prev => { const n={...prev}; delete n[cardId]; return n; });
  }
  function setColumnWidth(colId, widthMm) { setLayout(prev => { const next = cloneLayout(prev); const c = next.columns.find(c=>c.id===colId); if (!c) return prev; c.widthMm = widthMm; return next; }); }
  function setCardHeight(cardId, heightMm) { setCardHeights(prev => ({...prev, [cardId]: heightMm})); }
  function getWaste() { let total=0; const details=[]; document.querySelectorAll('.fig-wrap').forEach(fw => { const img=fw.querySelector('img'); if(!img)return; const fr=fw.getBoundingClientRect(),ir=img.getBoundingClientRect(); const wH=Math.abs(fr.height-ir.height),wW=Math.abs(fr.width-ir.width); total+=wH+wW; details.push({card:fw.closest('.card')?.dataset.id,wasteH:Math.round(wH),wasteW:Math.round(wW),pct:Math.round((wH+wW)/(fr.height+fr.width)*100)}); }); return {total:Math.round(total),details}; }
  function getLayout() { const s=currentScaleRef.current; const r=[]; document.querySelectorAll('#poster > .col').forEach(col => { const cards=[]; col.querySelectorAll('.card').forEach(c => { const b=c.getBoundingClientRect(); cards.push({id:c.dataset.id,height:Math.round(b.height/s),heightMm:Math.round(b.height/s/MM),grow:c.classList.contains('grow')}); }); r.push({colId:col.id,widthPx:Math.round(col.getBoundingClientRect().width/s),widthMm:Math.round(col.getBoundingClientRect().width/s/MM),cards}); }); return r; }

  function resetLayout() { setLayout(cloneLayout(DEFAULT_LAYOUT)); setCardHeights({...DEFAULT_CARD_HEIGHTS}); setFontScaleState(DEFAULT_FONT_SCALE); setLogos([...DEFAULT_LOGOS]); setSelectedCard(null); localStorage.removeItem(LS_KEY); }
  function saveConfig() { const cfg=getFullConfig(layout,cardHeights,fontScale,logos); const b=new Blob([JSON.stringify(cfg,null,2)+'\n'],{type:'application/json'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='poster-config.json'; a.click(); URL.revokeObjectURL(u); }
  function copyConfig() { navigator.clipboard.writeText(JSON.stringify(getFullConfig(layout,cardHeights,fontScale,logos),null,2)).then(()=>alert('Config copied! Paste it to Claude.')); }
  function setFontScale(s) { setFontScaleState(parseFloat(s)||1.3); }

  useEffect(() => { window.posterAPI = { swapCards, moveCard, setColumnWidth, setCardHeight, setFontScale, getWaste, getLayout, getConfig:()=>getFullConfig(layout,cardHeights,fontScale,logos), resetLayout, saveConfig, copyConfig }; });

  function handleSwapClick(cardId, e) { e.stopPropagation(); if (!selectedCard) setSelectedCard(cardId); else if (selectedCard===cardId) setSelectedCard(null); else { swapCards(selectedCard, cardId); setSelectedCard(null); } }
  function handleDropZone(targetColId, position, e) { e.stopPropagation(); if (!selectedCard) return; moveCard(selectedCard, targetColId, position); setSelectedCard(null); }

  function handleColResize(dividerIdx, e) {
    e.preventDefault(); const handle=e.currentTarget; handle.classList.add('active');
    const targetColIdx=dividerIdx===0?0:2; const invert=dividerIdx===0?1:-1;
    const targetEl=document.getElementById(layout.columns[targetColIdx].id);
    const startX=e.clientX; const scale=currentScaleRef.current;
    const startW=targetEl.getBoundingClientRect().width/scale;
    function onMove(ev) { const dx=(ev.clientX-startX)/scale*invert; const newW=Math.max(120,(startW+dx)/MM); setLayout(prev => { const next=cloneLayout(prev); next.columns[targetColIdx].widthMm=Math.round(newW); return next; }); }
    function onUp() { document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); handle.classList.remove('active'); document.body.style.cursor=''; }
    document.body.style.cursor='col-resize'; document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
  }

  function handleRowResize(colId, cardAboveIdx, e) {
    e.preventDefault(); const handle=e.currentTarget; handle.classList.add('active');
    const col=layout.columns.find(c=>c.id===colId); const aboveId=col.cards[cardAboveIdx];
    const aboveEl=document.querySelector('[data-id="'+aboveId+'"]'); if(!aboveEl)return;
    const startY=e.clientY; const scale=currentScaleRef.current; const startH=aboveEl.getBoundingClientRect().height/scale;
    setCardHeights(prev=>({...prev,[aboveId]:startH/MM}));
    function onMove(ev) { const dy=(ev.clientY-startY)/scale; setCardHeights(prev=>({...prev,[aboveId]:Math.max(20,(startH+dy)/MM)})); }
    function onUp() { document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); handle.classList.remove('active'); document.body.style.cursor=''; }
    document.body.style.cursor='row-resize'; document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
  }

  function isCardGrow(cardId) {
    if (cardHeights[cardId] != null) return false;
    for (const col of layout.columns) {
      const idx = col.cards.indexOf(cardId); if (idx===-1) continue;
      const hasGrower = col.cards.some(cid => CARD_REGISTRY[cid]?.grow && cardHeights[cid]==null);
      if (hasGrower) return CARD_REGISTRY[cardId]?.grow || false;
      const lastFlexible = [...col.cards].reverse().find(cid => cardHeights[cid]==null);
      return cardId === lastFlexible;
    }
    return false;
  }

  function renderCard(cardId) {
    const card = CARD_REGISTRY[cardId]; if (!card) return null;
    const classes = ['card']; if (card.color) classes.push(card.color); if (isCardGrow(cardId)) classes.push('grow'); if (selectedCard===cardId) classes.push('swap-selected');
    const style = {}; if (cardHeights[cardId]!=null) style.flex='0 0 '+cardHeights[cardId]+'mm';
    return (<div key={cardId} className={classes.join(' ')} data-id={cardId} style={style}><div className="swap-handle" onClick={(e)=>handleSwapClick(cardId,e)}>&#x2725;</div><h2>{card.num && <span className="num">{card.num}</span>}{card.title}</h2>{card.body}</div>);
  }

  function renderDropZone(colId, position) {
    const visible = selectedCard !== null;
    return (<div key={'dz-'+colId+'-'+position} className={'drop-zone'+(visible?' visible':'')} onClick={(e)=>handleDropZone(colId,position,e)}>{visible && <div className="drop-zone-inner" />}</div>);
  }

  function renderColumn(col) {
    const style = col.widthMm != null ? {flex:'0 0 '+col.widthMm+'mm'} : {flex:'1.5'};
    const children = [renderDropZone(col.id, 0)];
    col.cards.forEach((cardId, i) => {
      children.push(renderCard(cardId));
      if (i < col.cards.length - 1) children.push(<div key={'row-'+col.id+'-'+i} className="divider row-resize" onMouseDown={(e)=>handleRowResize(col.id,i,e)} />);
      children.push(renderDropZone(col.id, i + 1));
    });
    return (<div key={col.id} className="col" id={col.id} style={style}>{children}</div>);
  }

  return (
    <>
      <div className="toolbar">
        <button onClick={()=>setPreview(!preview)} style={preview?{background:'#2d7fc1',color:'#fff'}:{}}>{preview?'Edit':'Preview'}</button>
        {!preview && <>
          <button onClick={()=>setFontScale(Math.max(0.8,fontScale-0.1))}>A-</button>
          <button onClick={()=>setFontScale(fontScale+0.1)}>A+</button>
          <button onClick={saveConfig} title="Download poster-config.json">Save</button>
          <button onClick={copyConfig} title="Copy config JSON to clipboard">Copy Config</button>
          <button onClick={resetLayout}>Reset</button>
        </>}
      </div>

      <div className="header">
        <div className="header-left">
          <div className="title-block">
            <h1><span className="m">Denoise First, Orthogonalize Later</span></h1>
            <div className="subtitle">Understanding Momentum in Muon via Spectral Filtering</div>
          </div>
          <div className="author-block">
            <div className="authors">Xianliang Li<sup>1,2,*</sup>, Zihan Zhang<sup>3,2,*</sup>, Weiyang Liu<sup>4</sup>, Han Bao<sup>1,2,5,6,✉</sup></div>
            <div className="aff"><sup>1</sup>ISM &nbsp;<sup>2</sup>SOKENDAI &nbsp;<sup>3</sup>NII &nbsp;<sup>4</sup>CUHK &nbsp;<sup>5</sup>Tohoku Univ. &nbsp;<sup>6</sup>RIKEN AIP &nbsp;&nbsp;<span style={{fontSize:'0.78em'}}>* equal contribution &nbsp;✉ corresponding</span></div>
          </div>
        </div>
        <div className="header-right">
          <div className="header-qrs">
            <div className="qr"><img src="qr-arxiv.png" alt="arXiv QR" /><div className="ql">arXiv</div></div>
            <div className="qr"><img src="qr.png" alt="Project page QR" /><div className="ql">Project page</div></div>
            <div className="qr"><img src="qr-code.png" alt="Code repository QR" /><div className="ql">Code</div></div>
          </div>
        </div>
      </div>

      <div className="poster" id="poster" ref={posterRef}>
        {layout.columns.map((col, colIdx) => {
          const elements = [];
          if (colIdx > 0) elements.push(<div key={'col-div-'+colIdx} className="divider col-resize" onMouseDown={(e)=>handleColResize(colIdx-1,e)} />);
          elements.push(renderColumn(col));
          return elements;
        })}
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PosterApp />);
</script>
</body>
</html>
